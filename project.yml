# XcodeGen project file for InstantNotes
# Generated following: instant_notes_plan.md Phase 1
# Project gen: XcodeGen `project.yml`, app target `InstantNotes`
#
# NOTE: Info.plist and the entitlements file are GENERATED from the `info` and
# `entitlements` properties below — edit keys here, not in those files.

include:
  - path: project.yml.local
    optional: true

name: InstantNotes
options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM set in project.yml.local (gitignored)

targets:
  InstantNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Mac Catalyst, not a native AppKit target: the app leans on UIKit, AVAudioSession and
    # PencilKit, all of which Catalyst keeps working as-is.
    supportedDestinations: [iOS, macCatalyst]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homezero1.instantnotes
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # The sandbox entitlements are Catalyst-only; the iOS build keeps its empty file.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: InstantNotes/InstantNotesMacCatalyst.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.homezero1.instantnotes.debug
    sources:
      - path: InstantNotes
        excludes:
          - "**/*.swift~" # generated files to avoid compiler warnings
    dependencies:
      - package: MeetingMindKit
    scheme:
      testTargets:
        - InstantNotesTests
    entitlements:
      path: InstantNotes/InstantNotes.entitlements
    resources:
      - path: InstantNotes/PrivacyInfo.xcprivacy
    info:
      path: InstantNotes/Info.plist
      properties:
        CFBundleDisplayName: Recapped
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: PaperBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking requires all four orientations.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        NSSpeechRecognitionUsageDescription: Recapped turns meeting recordings into text for summaries. Transcription uses on-device recognition when available; otherwise audio may be sent to Apple for speech recognition.
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Recapped needs microphone access to record audio during meetings so it can transcribe and analyze them automatically.
        NSCameraUsageDescription: Recapped uses the camera to take photos you add to your notes.
        NSPhotoLibraryAddUsageDescription: Recapped saves the photos you share from a note to your library.
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        # No encryption beyond what iOS provides, so App Store Connect skips the export
        # compliance question on each build.
        ITSAppUsesNonExemptEncryption: false

  # Runs inside the app on the simulator: `xcodebuild test -scheme InstantNotes`.
  InstantNotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: InstantNotesTests
    dependencies:
      - target: InstantNotes
      - package: MeetingMindKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.homezero1.instantnotes.tests

packages:
  MeetingMindKit:
    path: Packages/MeetingMindKit
